name: Build Moon Fitness Android Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Production Android Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Package Assets & Build Standalone Release APK
        run: |
          if [ -d "fitness_tracker_app/android" ]; then
            cd fitness_tracker_app/android
            mkdir -p app/src/main/assets
            cp -r ../*.html ../*.js ../*.css ../*.png ../*.mp3 app/src/main/assets/ 2>/dev/null || true
          elif [ -d "android" ]; then
            cd android
            mkdir -p app/src/main/assets
            cp -r ../*.html ../*.js ../*.css ../*.png ../*.mp3 app/src/main/assets/ 2>/dev/null || true
          fi
          chmod +x gradlew 2>/dev/null || gradle wrapper
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Upload Standalone Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moon-Fitness-Android-Production-APK
          path: |
            **/android/app/build/outputs/apk/**/*.apk
            **/*.apk
          retention-days: 30
