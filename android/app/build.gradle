plugins {
    id 'com.android.application'
}

android {
    namespace 'com.moon.fitness'
    compileSdk 34

    defaultConfig {
        applicationId "com.moon.fitness"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Live production web URL the installed app launches into (auth backend lives there).
        // Set via -PMOON_PUBLIC_URL=https://your-host or the MOON_PUBLIC_URL env var.
        def moonUrl = (project.findProperty('MOON_PUBLIC_URL') ?: System.getenv('MOON_PUBLIC_URL') ?: '').toString()
        buildConfigField "String", "MOON_PUBLIC_URL", "\"${moonUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}

